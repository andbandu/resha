{% load i18n %}
<button class="sticky toggle-nav-sidebar" id="toggle-nav-sidebar" aria-label="{% translate 'Toggle navigation' %}"></button>
<nav class="sticky resha-sidebar" id="nav-sidebar" aria-label="{% translate 'Sidebar' %}">
  <div class="resha-sidebar-top">
    {% url 'admin:index' as admin_index_url %}
    <a href="{{ admin_index_url }}" class="resha-sidebar-overview{% if request.path == admin_index_url %} is-active{% endif %}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Dashboard Overview</span>
    </a>
    <div class="resha-sidebar-search">
      <svg class="resha-search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="nav-filter"
             placeholder="{% translate 'Filter workspace… ( / )' %}"
             aria-label="{% translate 'Filter navigation items' %}">
    </div>
  </div>
  <div class="resha-sidebar-groups">
    {% include 'admin/app_list.html' with app_list=available_apps show_changelinks=False %}
  </div>
</nav>
